site_name: "Isaac Lab & Isaac Sim 学习 Wiki"
site_description: Isaac Lab 与 Isaac Sim 分级学习讲义
site_author: Kytolly
docs_dir: ../build/preview/docs
site_dir: ../build/preview/site
use_directory_urls: true
repo_url: https://github.com/Kytolly/wiki-tutorial-Isaac

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - L0 概念启蒙:
      - Isaac Sim 是什么: L0-Isaac-Sim是什么.md
      - Isaac Lab 是什么: L0-Isaac-Lab是什么.md
      - 安装与环境配置: L0-安装与环境配置.md
      - 运行第一个 Demo: L0-运行第一个Demo.md
      - 学习路线与下一步: L0-学习路线与下一步.md
  - L1 入门:
      - 强化学习核心概念: L1-强化学习核心概念.md
      - 项目结构与训练流程: L1-Isaac-Lab项目结构与训练流程.md
      - 第一个训练任务: L1-第一个训练任务.md
  - 关于:
      - Wiki 状态: _META.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
