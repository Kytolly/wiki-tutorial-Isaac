site_name: "Isaac Lab & Isaac Sim 学习 Wiki"
site_description: Isaac Lab 与 Isaac Sim 分级学习讲义
site_author: Kytolly
docs_dir: ../build/preview/docs
site_dir: ../build/preview/site
use_directory_urls: true
repo_url: https://github.com/Kytolly/wiki-tutorial-Isaac

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

