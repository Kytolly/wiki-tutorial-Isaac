site_name: "Isaac Lab & Isaac Sim 学习 Wiki"
site_description: Isaac Lab 与 Isaac Sim 分级学习讲义
site_author: Kytolly
docs_dir: ../build/preview/docs
site_dir: ../build/preview/site
use_directory_urls: true
repo_url: https://github.com/Kytolly/wiki-tutorial-Isaac

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js

nav:
  - 首页: index.md
  - intro 概念启蒙:
      - Isaac Sim 是什么: Isaac-Sim是什么.md
      - Isaac Lab 是什么: Isaac-Lab是什么.md
  - setup 环境与 Demo:
      - 安装与环境配置: 安装与环境配置.md
      - 运行第一个 Demo: 运行第一个Demo.md
      - 学习路线与下一步: 学习路线与下一步.md
  - train 训练入门:
      - 强化学习核心概念: 强化学习核心概念.md
      - 项目结构与训练流程: Isaac-Lab项目结构与训练流程.md
      - 第一个训练任务: 第一个训练任务.md
  - 关于:
      - Wiki 状态: _META.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
