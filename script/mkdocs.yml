site_name: "Isaac Lab & Isaac Sim 学习 Wiki"
site_description: Isaac Lab 与 Isaac Sim 分级学习讲义
site_author: Kytolly
docs_dir: ../build/preview/docs
site_dir: ../build/preview/site
use_directory_urls: true
repo_url: https://github.com/Kytolly/wiki-tutorial-Isaac

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 概念启蒙:
      - 领域概览:
          - Isaac Sim 是什么: Isaac-Sim是什么.md
          - Isaac Lab 是什么: Isaac-Lab是什么.md
      - 平台架构:
          - Isaac Sim 架构与核心概念: Isaac Sim架构与核心概念.md
      - 双工具协作:
          - Isaac Sim 与 Isaac Lab 如何协作: Isaac-Sim与Isaac-Lab如何协作.md
  - 环境与Demo:
