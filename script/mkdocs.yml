          - 最小骨架与验证: M2-03-最小骨架与验证.md
          - 视觉碰撞与动力学: M2-04-视觉碰撞与动力学.md
          - 到 Isaac Lab 与系统辨识: M2-05-到Isaac-Lab与系统辨识.md
  - 关于:
      - Wiki 状态: _META.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
